    desc: Wtyczka docker-compose v2 do definiowania uslug
    category: Wirtualizacja i Kontenery
    ports: Brak domyslnych
  pkg_6:
    name: Serwer WWW Nginx
    desc: Wydajny serwer HTTP / Reverse Proxy (Porty 80/443)
    category: Serwery WWW
